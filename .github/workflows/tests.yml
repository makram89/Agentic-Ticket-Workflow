name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest -q
