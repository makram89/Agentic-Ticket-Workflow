[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketflow"
version = "0.1.0"
description = "Agentic support-ticket workflow with FastAPI and Temporal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio[opentelemetry]>=1.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "openai>=1.30",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
include = ["ticketflow*"]

[tool.setuptools.package-data]
ticketflow = ["data/seed/*.json"]
