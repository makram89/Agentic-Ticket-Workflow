services:
  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # gRPC
      - "8233:8233"   # web UI

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP

  api:
    build: .
    command: ["uvicorn", "ticketflow.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      LLM_MODE: ${LLM_MODE:-fake}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: api
    ports:
      - "8000:8000"
    depends_on:
      - temporal
      - jaeger

  worker:
    build: .
    command: ["python", "-m", "ticketflow.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      LLM_MODE: ${LLM_MODE:-fake}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: worker
    depends_on:
      - temporal
      - jaeger
